upstream app {
	server app:3000;
}

server {
	listen 80 default_server;
	root /web;

	auth_basic_user_file .htpasswd;

	location /admin {
		auth_basic "Admin Area";
		include security_headers.conf;
		proxy_intercept_errors on;
		proxy_pass http://app;
	}

	location / {
		include security_headers.conf;
		proxy_intercept_errors on;
		proxy_pass http://app;
	}
}
